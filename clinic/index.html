<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>醫館 · 계획이 나를 대신하는 곳</title><link rel="stylesheet" href="assets/font.css"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="seal">醫</span><div><h1>醫館</h1><p>肺 · 大腸 / 청사진의 첫 병동</p></div></div><nav aria-label="책장"><button id="bookButton">의서 <kbd>B</kbd></button><button id="blueprintButton">청사진 책 <kbd>N</kbd></button><button id="gardenButton">정원</button><a href="guide/" target="_blank">검수 장부</a><button id="exportButton">기록 내보내기</button></nav></header>
<div id="notice" role="status" aria-live="polite"></div>
<main id="clinic"><section class="charts" aria-label="대기 차트"><div class="section-title"><h2>오늘의 차트</h2><span id="dayLabel"></span></div><div id="charts"></div><div class="physician"><span class="eyebrow">동료의 책갈피</span><h3>士安 · 皇甫謐</h3><p>晉 · 鍼灸甲乙經</p><blockquote>經脈者 所以能決死生 處百病 調虛實 不可不通也</blockquote><small>인용: 靈樞 經脈 · 교재 doc4, §6<br>士安 호칭은 지시서 지정값</small></div></section>
<section class="body-column" aria-label="몸 위 지정"><div class="body-tools"><div id="views"></div><div><button id="layerButton">表</button><button id="sideButton">가쪽</button></div></div><div class="body-stage"><svg id="body" role="img" aria-label="銅人 · 몸 위에 자리를 지정"></svg><div id="bodyCaption"></div></div><div class="zoom-tools"><button data-zoom="all">전체</button><button data-zoom="arms">손·팔</button><button data-zoom="torso">몸통</button><button data-zoom="legs">다리·발</button><button id="zoomIn" aria-label="확대">＋</button><button id="zoomOut" aria-label="축소">−</button><button id="undoButton">지정 취소</button></div><div id="result" aria-live="polite"></div></section>
<section class="planning" aria-label="계획판"><div id="plan"></div><footer class="day-footer"><div id="hours"></div><button id="closeButton" class="primary">閉門 · 오늘을 마친다</button></footer></section></main>
<section id="garden" hidden><span class="eyebrow">閉門 뒤의 몸</span><h2>남겨 둔 계획</h2><div id="gardenContent"></div><button id="returnButton">醫館으로</button></section>
<footer class="global-footer"><span id="saveStatus">이 브라우저에 저장</span><span>위치는 출전 대조 도식 · 맞음새와 時辰은 게임 설정</span><button id="padButton" title="컨트롤러 버튼 배치를 다시 잡습니다">🎮 패드 설정</button><button id="debugToggle">시험용 날짜</button><button id="nextDay" hidden>시험 · 다음 날로</button></footer>
<dialog id="sheet"><div class="sheet-header"><h2 id="sheetTitle"></h2><button id="sheetClose">덮기 · Esc</button></div><div id="sheetBody"></div></dialog>
<script type="module" src="src/app.js"></script></body></html>
